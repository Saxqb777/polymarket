<form hx-post="/trade/{{ run_id }}/edit-close"
      hx-target="#action-panel"
      hx-swap="innerHTML">

  <div class="td-cells" style="margin-bottom: 20px;">

    <div class="td-cell">
      <label class="td-cell-label" for="ec-exit">Exit Price</label>
      <input id="ec-exit" class="action-input" type="number" step="0.01" name="exit_price"
             value="{{ '%.2f'|format(trade.exit_price) if trade.exit_price else '' }}"
             placeholder="0.00" required>
    </div>

    <div class="td-cell">
      <label class="td-cell-label" for="ec-pnl">P&L ($)</label>
      <input id="ec-pnl" class="action-input" type="number" step="0.01" name="pnl_dollars"
             value="{{ '%.2f'|format(trade.pnl_dollars) if trade.pnl_dollars is not none else '' }}"
             placeholder="−2.00" required>
    </div>

    <div class="td-cell">
      <label class="td-cell-label" for="ec-outcome">Outcome</label>
      <select id="ec-outcome" class="action-input" name="outcome" required>
        <option value="WIN"    {% if trade.outcome == 'WIN'    %}selected{% endif %}>WIN</option>
        <option value="LOSS"   {% if trade.outcome == 'LOSS'   %}selected{% endif %}>LOSS</option>
        <option value="MANUAL" {% if trade.outcome == 'MANUAL' %}selected{% endif %}>MANUAL</option>
      </select>
    </div>

  </div>

  <div style="margin-bottom: 16px;">
    <label class="td-cell-label" for="ec-notes" style="display:block; margin-bottom:6px;">Notes (optional)</label>
    <input id="ec-notes" class="action-input" type="text" name="notes"
           value="{{ trade.outcome_notes or '' }}"
           placeholder="What changed?" style="width:100%;">
  </div>

  <div class="action-buttons">
    <button type="submit" class="action-button-primary">SAVE CHANGES</button>
    <button type="button" class="action-button-ghost"
            hx-get="/trade/{{ run_id }}/close-form"
            hx-target="#action-panel"
            hx-swap="innerHTML">Cancel</button>
  </div>

</form>
